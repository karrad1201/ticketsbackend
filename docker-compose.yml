services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bilets
      POSTGRES_USER: bilets
      POSTGRES_PASSWORD: bilets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  wiremock:
    image: wiremock/wiremock:latest
    ports:
      - "8888:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    command: --verbose

volumes:
  postgres_data:
