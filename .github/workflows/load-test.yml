name: Load Test (k6)

# Запускается только вручную через GitHub UI или gh CLI
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль нагрузки'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
      base_url:
        description: 'URL бэкенда (пусто = запустить локально в CI)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  load-test:
    name: k6 (${{ inputs.profile }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bilets
          POSTGRES_USER: bilets
          POSTGRES_PASSWORD: bilets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilets"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      wiremock:
        image: wiremock/wiremock:latest
        ports:
          - 8888:8080
        volumes:
          - ${{ github.workspace }}/wiremock/mappings:/home/wiremock/mappings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # Если BASE_URL не задан — собираем и запускаем бэкенд в CI
      - name: Build application
        if: ${{ inputs.base_url == '' }}
        run: ./mvnw -q package -DskipTests

      - name: Start application
        if: ${{ inputs.base_url == '' }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bilets
          SPRING_DATASOURCE_USERNAME: bilets
          SPRING_DATASOURCE_PASSWORD: bilets
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          PAYMENT_GATEWAY_BASE_URL: http://localhost:8888
        run: |
          java -jar target/*.jar &
          echo "APP_PID=$!" >> $GITHUB_ENV
          # Ждём готовности
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Application started"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done

      - name: Install k6
        run: |
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q && sudo apt-get install -y -q k6

      - name: Run k6
        env:
          BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || 'http://localhost:8080' }}
          PROFILE: ${{ inputs.profile }}
        run: |
          k6 run \
            -e BASE_URL=$BASE_URL \
            -e PROFILE=$PROFILE \
            --out json=k6-results.json \
            k6/load-test.js

      - name: Upload k6 results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ inputs.profile }}
          path: k6-results.json
          retention-days: 14
          if-no-files-found: warn
