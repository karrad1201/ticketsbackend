spring:
  application:
    name: bilets
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000
    cache-names:
      - categories.all
      - cities.all
      - layoutTemplates.byVenueSpaceId
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/bilets
    driver-class-name: org.postgresql.Driver
    username: bilets
    password: bilets
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

server:
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: "*"

tbank:
  base-url: http://localhost:8888
  terminal-key: test
  password: ""
  notification-url: http://localhost:8080/api/payments/callbacks/tbank

zvonok:
  base-url: http://localhost:8888
  public-key: test
  campaign-id: test

order-flow:
  persistence: jdbc

purchase:
  hold-ttl: PT30M
  platform-commission-rate: 0.10

operations:
  scheduling:
    enabled: true
    initial-delay-ms: 300000
    close-started-sales-delay-ms: 60000
    stale-payments-delay-ms: 60000
  batches:
    auto-close-event-sales-limit: 100
    stale-payments-limit: 100
