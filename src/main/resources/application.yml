spring:
  application:
    name: bilets
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000
    cache-names:
      - categories.all
      - cities.all
      - layoutTemplates.byVenueSpaceId
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/bilets
    driver-class-name: org.postgresql.Driver
    username: bilets
    password: bilets
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

server:
  address: 0.0.0.0

order-flow:
  persistence: jdbc

purchase:
  hold-ttl: PT30M
  platform-commission-rate: 0.10

operations:
  scheduling:
    enabled: true
    initial-delay-ms: 300000
    close-started-sales-delay-ms: 60000
    stale-payments-delay-ms: 60000
  batches:
    auto-close-event-sales-limit: 100
    stale-payments-limit: 100
