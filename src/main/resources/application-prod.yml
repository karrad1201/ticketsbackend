spring:
  data:
    redis:
      url: ${REDIS_URL}
  datasource:
    url: ${DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

tbank:
  base-url: https://securepay.tinkoff.ru/v2
  terminal-key: ${TBANK_TERMINAL_KEY}
  password: ${TBANK_PASSWORD}
  notification-url: ${TBANK_NOTIFICATION_URL}

zvonok:
  base-url: https://zvonok.com
  public-key: ${ZVONOK_PUBLIC_KEY}
  campaign-id: ${ZVONOK_CAMPAIGN_ID}

push:
  fcm:
    enabled: ${PUSH_FCM_ENABLED:false}
